<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — 这里没有东西</title>
<meta name="description" content="页面不存在。沉到水底了。">
<!-- nginx 是在原 URL 上内部重写到 /404.html 的，地址栏仍停在 /foo/bar。
     没有这一行时，下面的 css/js/导航都按 /foo/ 解析而 404，页面会变成裸 HTML。 -->
<base href="/">
<link rel="stylesheet" href="css/pages.css">
<!-- 右上角登录入口（本轮新增）。这一页仍是深色皮肤（只加载 pages.css），
     comments.css 里的颜色别名会自动落回 pages.css 的令牌，所以入口/模态框
     在这一页是"白底卡片"，白底深字，在深色背景上依然可读。 -->
<link rel="stylesheet" href="css/comments.css">
<!-- 站点外壳（收起侧边栏 / 访问统计）—— 必须排在所有皮肤之后：
     它是"同一个部件在所有页面长得一样"的唯一出处，靠后加载取胜。 -->
<link rel="stylesheet" href="css/shell.css">
<!-- 收起偏好要在首屏绘制之前写进 <html data-nav>，所以这个脚本**不能** defer
     （原因见 js/shell.js 开头）；它只取一次 localStorage，不碰 DOM。
     本页带 <base href="/">，相对路径按站点根解析，不受影响。 -->
<script src="js/shell.js"></script>
</head>
<!-- skin-deep：告诉 shell.css 这一页是深水底皮肤（本页只加载 pages.css，
     没有 geo.css 的 --g-* 令牌），组件换一套颜色别名即可 -->
<body class="skin-deep">

<a class="skip" href="#main">跳到正文</a>

<!-- ============================================================
     右上角用户入口（标记写在 HTML 里，脚本挂了也看得见）
     本页带 <base href="/">，相对路径的 js/css 会按站点根解析，不受影响。
     ============================================================ -->
<div class="auth-entry" id="authEntry" data-auth-entry>
  <button class="auth-btn" type="button" data-auth-open
          aria-haspopup="dialog" aria-expanded="false">登录</button>
</div>

<nav class="nav" id="nav" aria-label="站点导航">
  <div class="nav-bar">
    <a class="nav-brand" href="index.html">
      <!-- 收起态只显示这一枚缩写（字由 js/shell.js 取站名首字写入） -->
      <span class="nav-brand-mark" aria-hidden="true">S</span>
      <span class="nav-brand-name" data-site-name>SIMON 的个人站</span>
      <span class="nav-brand-tag" data-site-sub>PERSONAL SITE</span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="navList">
      <span class="nt-bars" aria-hidden="true"><i></i><i></i></span>
      <span class="nt-text-closed">MENU</span>
      <span class="nt-text-open">CLOSE</span>
    </button>
    <!-- 桌面端收起/展开（与上面的 MENU 是两件事）：只改侧边栏宽度，
         展开是完整文字菜单、收起是 76px 图标栏，偏好写 localStorage。
         ≤980px 由 shell.css 隐藏，那一档交给 MENU 抽屉。 -->
    <button class="nav-rail" type="button" data-nav-collapse aria-expanded="true"
            aria-controls="nav" aria-label="收起侧边栏" title="收起侧边栏">
      <svg class="nr-ic" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
        <rect x="2.6" y="3.6" width="14.8" height="12.8" rx="1.4"/>
        <path d="M8.2 3.6v12.8"/>
        <path class="nr-arrow" d="M12.9 8.1 10.9 10l2 1.9"/>
      </svg>
    </button>
  </div>

  <ul class="nav-list" id="navList">
    <li><a class="nav-link" href="about.html"><span class="nl-ic" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><circle cx="12" cy="8.6" r="3.6"/><path d="M4.8 19.6c.7-3.6 3.6-5.4 7.2-5.4s6.5 1.8 7.2 5.4"/></svg></span><span class="nl-en">ABOUT</span><span class="nl-cn">关于我</span></a></li>
    <li><a class="nav-link" href="archive.html"><span class="nl-ic" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><rect x="3.6" y="4.6" width="16.8" height="14.8"/><path d="M7.2 9.4h9.6M7.2 12.6h9.6M7.2 15.8h5.6"/></svg></span><span class="nl-en">ARTICLES</span><span class="nl-cn">博客文章</span></a></li>
    <li><a class="nav-link is-todo" href="index.html" data-todo="待定"><span class="nl-ic" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><rect x="4.2" y="4.2" width="15.6" height="15.6" stroke-dasharray="3.2 3.2"/><circle cx="12" cy="12" r="1.6"/></svg></span><span class="nl-en">TBD</span><span class="nl-cn">待定</span></a></li>
  </ul>

  <div class="nav-foot">
    <a class="nav-back" href="index.html" data-tip="回到入口页"><span class="nb-arrow" aria-hidden="true">←</span><span class="nb-text">BACK TO ENTRY</span></a>
    <span data-year>© 2026 SIMON 的个人站</span>
  </div>
</nav>
<div class="nav-scrim" role="presentation"></div>

<div class="page">
  <main class="main" id="main">

    <section class="err" aria-labelledby="errTitle">
      <!-- 空心描边 + 红色叠印：与站内大标题同一套分色手法 -->
      <p class="err-code" data-text="404" aria-hidden="true">404</p>

      <div>
        <span class="page-kicker">NOT FOUND</span>
        <h1 class="err-title" id="errTitle">这一页沉到水底了</h1>
        <p class="err-en">THIS PAGE WENT UNDER</p>
      </div>

      <p class="err-text">
        地址 <code id="errPath">/</code> 没有对应的页面。可能是链接过期了，
        也可能是这个栏目还没做 —— 目前站点只有三处内容：主界面、关于我、博客文章。
      </p>

      <div class="err-actions">
        <a class="btn is-primary" href="index.html">回主界面 <span class="kbd">ESC</span></a>
        <a class="btn" href="archive.html">看全部文章</a>
        <a class="btn" href="about.html">关于我</a>
      </div>
    </section>

  </main>

  <footer class="foot">
    <span class="f-brand" data-site-name>SIMON 的个人站</span>
    <span>落水而入 · 静态站点</span>
    <span class="f-right"><span data-foot-note>按 ESC 回主界面</span> · © <span data-year>2025</span></span>
  </footer>
</div>

<script src="js/data.js" defer></script>
<script src="js/auth-ui.js" defer></script>
<script src="js/pages.js" defer></script>
<script>
/* 把用户实际访问的路径填进提示里 —— 出错信息里带上"你访问的是什么"，
   比一句干巴巴的"页面不存在"有用得多。file:// 下 pathname 依然可读。 */
document.addEventListener('DOMContentLoaded', function () {
  var el = document.getElementById('errPath');
  if (!el) return;
  var p = window.location.pathname + window.location.search + window.location.hash;
  el.textContent = p || '/';
});
</script>
</body>
</html>
