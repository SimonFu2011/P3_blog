<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文章 — SIMON 的个人站</title>
<meta name="description" content="文章详情。">
<link rel="stylesheet" href="css/pages.css">
<!-- 纯白极简皮肤：与"关于我 / 归档"同一套。geo.css 管页面骨架，
     prose-light.css 管正文与文章页专有的块（正文/代码块/上下篇/评论区）。
     顺序不能换：同权重靠后加载取胜。 -->
<link rel="stylesheet" href="css/geo.css">
<link rel="stylesheet" href="css/prose-light.css">
<!-- 本轮新增：右上角登录入口 + 自建评论组件。必须排在最后 ——
     它要覆盖 pages.css / prose-light.css 里旧评论区那套深色卡片样式。 -->
<link rel="stylesheet" href="css/comments.css">
</head>
<body>

<a class="skip" href="#main">跳到正文</a>

<!-- ============================================================
     右上角用户入口
     ------------------------------------------------------------
     标记写在 HTML 里（脚本挂了也看得见），由 js/auth-ui.js 接管：
     未登录显示「登录」，有会话时换成用户名 + 下拉（我的评论 / 退出登录）。
     位置与样式见 css/comments.css §1。
     ============================================================ -->
<div class="auth-entry" id="authEntry" data-auth-entry>
  <button class="auth-btn" type="button" data-auth-open
          aria-haspopup="dialog" aria-expanded="false">登录</button>
</div>

<nav class="nav" id="nav" aria-label="站点导航">
  <div class="nav-bar">
    <a class="nav-brand" href="index.html">
      <span class="nav-brand-name" data-site-name>SIMON 的个人站</span>
      <span class="nav-brand-tag" data-site-sub>PERSONAL SITE</span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="navList">
      <span class="nt-bars" aria-hidden="true"><i></i><i></i></span>
      <span class="nt-text-closed">MENU</span>
      <span class="nt-text-open">CLOSE</span>
    </button>
  </div>

  <ul class="nav-list" id="navList">
    <li><a class="nav-link" href="about.html"><span class="nl-en">ABOUT</span><span class="nl-cn">关于我</span></a></li>
    <li><a class="nav-link" href="archive.html" aria-current="page"><span class="nl-en">ARTICLES</span><span class="nl-cn">博客文章</span></a></li>
    <li><a class="nav-link is-todo" href="index.html" data-todo="待定"><span class="nl-en">TBD</span><span class="nl-cn">待定</span></a></li>
  </ul>

  <div class="nav-foot">
    <a class="nav-back" href="index.html">BACK TO ENTRY</a>
    <span data-year>© 2026 SIMON 的个人站</span>
  </div>
</nav>
<div class="nav-scrim" role="presentation"></div>

<div class="page">
  <main class="main" id="main">

    <nav class="crumbs" aria-label="面包屑">
      <a href="index.html">首页</a>
      <span class="sep" aria-hidden="true">/</span>
      <a href="archive.html">博客文章</a>
      <span class="sep" aria-hidden="true">/</span>
      <span id="crumbCat">—</span>
    </nav>

    <!-- ------------------------------------------------------------
         文章外壳
         ------------------------------------------------------------
         #articleShell 默认 hidden，由 js/article.js 在成功注入正文后摘掉 ——
         避免"JS 挂了但骨架还在"的半成品页面。param 是文章 slug，
         走 ?slug=xxx，与归档页的链接一致。
         ------------------------------------------------------------ -->
    <article class="article" id="articleShell" hidden>

      <header class="article-head">
        <h1 class="article-title" id="articleTitle">—</h1>
        <div class="article-meta">
          <span>发布于 <time id="articleDate" datetime="">—</time></span>
          <span class="dot" aria-hidden="true"></span>
          <span>分类 <a id="articleCat" href="archive.html">—</a></span>
          <span class="dot" aria-hidden="true"></span>
          <span id="articleRead">—</span>
        </div>
        <div class="article-tags" id="articleTags"></div>
      </header>

      <!-- 正文由 JS 注入（html 片段，来源是本仓库自己的 js/posts.js） -->
      <div class="prose" id="articleBody"></div>

      <footer class="article-foot">
        <div>
          <span class="section-note">同一分类 / 标签下的其他文章见归档页</span>
        </div>
        <nav class="post-nav" id="postNav" aria-label="上下篇"></nav>
      </footer>
    </article>

    <!-- ------------------------------------------------------------
         评论区（自建组件，MySQL 存储）
         ------------------------------------------------------------
         · 默认 hidden：只有 js/article.js 确认"这篇文章真的存在"之后才放开。
           评论区是 #articleShell 之外的兄弟节点，不这样的话，访问一个不
           存在的 slug 会在"这篇文章不存在"下面多出一个空评论区，
           而且会真的去拉评论、甚至能发评论。
         · 客户端是本站自己写的（js/comments.js + css/comments.css），零依赖、
           零外部请求：接口走 /api/comments，会话走 /api/auth/*（同源 Cookie）。
         · 初始化只有一个入口 window.initComments(slug)：由 comments.js 提供，
           由 article.js 调用。文章到底存不存在，只由 article.js 判定。
           返回顶部那枚「登录」按钮（右上角）由 js/auth-ui.js 接管，两个文件
           共用同一个模态框：未登录点「发表 / 回复」就地弹它，不跳转。
         ------------------------------------------------------------ -->
    <section class="comments" id="comments" hidden aria-labelledby="commentsTitle">
      <div class="comments-head">
        <h2 class="section-title" id="commentsTitle">COMMENTS<span class="st-cn">评论</span></h2>
        <span class="section-note" id="commentsNote">自建评论 · 登录后可发表</span>
      </div>
      <div class="comments-box" id="commentsBox">
        <!-- 评论组件挂载点：列表 / 发表框 / 回复表单都注入到这里 -->
        <div id="commentsMount"></div>
        <!-- 资源还没到位时的占位；组件接管后撤掉 -->
        <p class="comments-note" id="commentsLoading">评论区加载中……</p>
      </div>
    </section>

    <!-- 文章不存在 / 参数缺失时的落点，由 JS 填充。
         标题用 h2：本页的 h1 是文章标题，一页只能有一个 h1。 -->
    <section class="empty notfound-box" id="notFound" hidden>
      <div class="empty-mark">NOT FOUND</div>
      <h2 class="err-title">这篇文章不存在</h2>
      <p class="err-text" id="notFoundText">
        链接里的 <code>slug</code> 参数没有对应的文章，可能已经被改名或删除。
      </p>
      <div class="err-actions">
        <a class="btn is-primary" href="archive.html">去看全部文章</a>
        <a class="btn" href="index.html">回主界面</a>
      </div>
    </section>

  </main>

  <footer class="foot">
    <span class="f-brand" data-site-name>SIMON 的个人站</span>
    <span>落水而入 · 静态站点</span>
    <span class="f-right"><span data-foot-note>按 ESC 回主界面</span> · © <span data-year>2025</span></span>
  </footer>
</div>

<script src="js/data.js" defer></script>
<script src="js/posts.js" defer></script>
<!-- 登录入口与评论组件：auth-ui.js 必须在 comments.js 之前（后者复用它的
     窗口对象 SiteAuth 与同一个模态框），两者都必须在 article.js 之前 ——
     article.js 渲染成功后要马上调 window.initComments(slug)。 -->
<script src="js/auth-ui.js" defer></script>
<script src="js/comments.js" defer></script>
<script src="js/article.js" defer></script>
<script src="js/pages.js" defer></script>
</body>
</html>
