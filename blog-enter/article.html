    <!-- ------------------------------------------------------------
         文章外壳
         ------------------------------------------------------------
         #articleShell 默认 hidden，由 js/article.js 在成功注入正文后摘掉 ——
         避免"JS 挂了但骨架还在"的半成品页面。param 是文章 slug，
         走 ?slug=xxx，与归档页的链接一致。
         ------------------------------------------------------------ -->
    <article class="article" id="articleShell" hidden>

      <header class="article-head">
        <h1 class="article-title" id="articleTitle">—</h1>
        <div class="article-meta">
          <span>发布于 <time id="articleDate" datetime="">—</time></span>
          <span class="dot" aria-hidden="true"></span>
          <span>分类 <a id="articleCat" href="archive.html">—</a></span>
          <span class="dot" aria-hidden="true"></span>
          <span id="articleRead">—</span>
        </div>
        <div class="article-tags" id="articleTags"></div>
      </header>

      <!-- 正文由 JS 注入（html 片段，来源是本仓库自己的 js/posts.js） -->
      <div class="prose" id="articleBody"></div>

      <footer class="article-foot">
        <div>
          <span class="section-note">同一分类 / 标签下的其他文章见归档页</span>
        </div>
        <nav class="post-nav" id="postNav" aria-label="上下篇"></nav>
      </footer>
    </article>

    <!-- ------------------------------------------------------------
         评论区（Waline，自建在服务器的 /comments/ 下）
         ------------------------------------------------------------
         · 默认 hidden：只有 js/article.js 确认"这篇文章真的存在"之后才放开。
           评论区是 #articleShell 之外的兄弟节点，不这样的话，访问一个不
           存在的 slug 会在"这篇文章不存在"下面多出一个空评论区，
           而且会真的去拉评论、甚至能发评论。
         · 客户端资源**自托管**（comments/waline.js、comments/waline.css），
           不走 unpkg：那玩意儿国内不稳定，挂了就是评论区一片空白，而且是
           运行时才失败 —— 本地测不出来。
         · 初始化只有一个入口 window.initComments(slug)：由下面的模块脚本
           准备，由 article.js 调用。文章到底存不存在，只由 article.js 判定。
         ------------------------------------------------------------ -->
    <section class="comments" id="comments" hidden aria-labelledby="commentsTitle">
      <div class="comments-head">
        <h2 class="section-title" id="commentsTitle">COMMENTS<span class="st-cn">评论</span></h2>
        <span class="section-note" id="commentsNote">Waline</span>
      </div>
      <div class="comments-box" id="commentsBox">
        <!-- 评论服务挂载点：内容由 comments/waline.js 注入 -->
        <div id="commentsMount" data-comments-slot="waline"></div>
        <!-- 资源还没到位时的占位；Waline 初始化后会被撤掉 -->
        <p class="comments-note" id="commentsLoading">评论区加载中……</p>
      </div>
    </section>

    <!-- 文章不存在 / 参数缺失时的落点，由 JS 填充。
         标题用 h2：本页的 h1 是文章标题，一页只能有一个 h1。 -->
    <section class="empty notfound-box" id="notFound" hidden>
      <div class="empty-mark">NOT FOUND</div>
      <h2 class="err-title">这篇文章不存在</h2>
      <p class="err-text" id="notFoundText">
        链接里的 <code>slug</code> 参数没有对应的文章，可能已经被改名或删除。
      </p>
      <div class="err-actions">
        <a class="btn is-primary" href="archive.html">去看全部文章</a>
        <a class="btn" href="index.html">回主界面</a>

<script src="js/data.js" defer></script>
<script src="js/posts.js" defer></script>
<script src="js/article.js" defer></script>
<script src="js/pages.js" defer></script>

<!-- ============================================================
     评论区（Waline）客户端引导
     ------------------------------------------------------------
     只做两件事：
       1) 把自托管的客户端资源备好（离线/失败时给人话说明，不甩红色报错）
       2) 暴露 window.initComments(slug)
     **不判断文章是否存在** —— 那是 js/article.js 的活。它已经处理过
     aliases 旧地址跳转等一堆情况，这里再判一次，两处迟早会不一致。

     时序：module 脚本天生 defer，article.js 也是 defer；谁先执行不确定，
     而且 import() 还要一次网络往返。所以两边都兜：
       · article.js 渲染成功时调 window.initComments（快路径）
       · 本脚本加载完若发现 window.Article 已在，就补一次（慢路径）
     两条路径靠 mounted 保证 init() 只会被调用一次。
     ============================================================ -->
<script type="module">
  const mount = document.getElementById('commentsMount');
  const loading = document.getElementById('commentsLoading');
  const box = document.getElementById('commentsBox');

  /* 出问题时的统一落点：一句人话，正文照常看 */
  const say = (text) => {
    if (loading) loading.hidden = true;
    if (!mount) return;
    mount.textContent = '';
    const p = document.createElement('p');
    p.className = 'cb-title';
    p.textContent = text;
    mount.appendChild(p);
  };

  if (!mount) {
    console.error('[comments] 页面里找不到 #commentsMount');
  } else if (!/^https?:$/.test(location.protocol)) {
    /* file:// 下 serverURL 必然跨域，Waline 的请求一定失败。
       这里直接给一句说明，**不初始化、不发任何请求**（双击打开也能看正文）。 */
    say('当前是直接打开本地文件，评论区需要联网才能加载。');
  } else {
    let started = false;

    /* 唯一的初始化入口。**只有文章确实存在时才会被调用**，所以访问一个不存在的
       slug 时，这里一个字节都不会下载 —— 更不会去请求评论接口。 */
    window.initComments = async (slug) => {
      if (started) return;
      started = true;
      try {
        const css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = 'comments/waline.css';
        document.head.appendChild(css);

        const { init } = await import('./comments/waline.js');

        if (loading) loading.hidden = true;
        if (box) box.classList.add('is-live');   /* 收掉占位卡片的外壳 */

        /* serverURL 从当前地址派生，不写死 IP：以后换域名、或站点挪到子目录，
           这里都不用改。 */
        const serverURL = new URL('comments/', location.href).href.replace(/\/$/, '');

        init({
          el: '#commentsMount',
          serverURL: serverURL,
          /* path 必须与公开地址严格一致：Waline 靠它把评论绑到文章上。
             不要用 location.href 派生 —— file:// 与 http:// 会得到不同的值，
             评论就会"换个地址打开就没了"。 */
          path: '/article.html?slug=' + slug,
          lang: 'zh-CN',
          /* login 必须与服务端环境变量 LOGIN 一致：
             服务端 force 而这里 disable → 提交时才报错；反过来 → 白让登录。 */
          login: 'disable',
          requiredMeta: ['nick', 'mail'],
          imageUploader: false,   /* 关掉上传入口；服务端没有对应开关 */
          search: false,          /* 表情搜索会去请求 giphy，关掉更干净 */
          reaction: false         /* 文章反应条：本站极简皮肤不需要，也就少一次请求 */
        });
      } catch (err) {
        if (box) box.classList.remove('is-live');
        console.error('[comments] 客户端资源加载失败', err);
        say('评论区加载失败（客户端资源没能加载）。正文不受影响，刷新可以再试。');
      }
    };

    /* 慢路径：本脚本跑到这里时 article.js 可能早就渲染完了 */
    if (window.Article && window.Article.slug) window.initComments(window.Article.slug);
  }
</script>
</body>
