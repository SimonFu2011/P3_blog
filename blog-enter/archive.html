<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/geo.css">
<!-- 右上角登录入口（本轮新增）：样式复用 geo.css 的 --g-* 与 pages.css 的字体变量 -->

<!-- 站点外壳（收起侧边栏 / 访问统计 / 标签云）—— 必须排在所有皮肤之后：
     它是"同一个部件在所有页面长得一样"的唯一出处，靠后加载取胜。 -->
<link rel="stylesheet" href="css/shell.css">
<!-- 收起偏好要在首屏绘制之前写进 <html data-nav>，所以这个脚本**不能** defer
     （原因见 js/shell.js 开头）；它只做一次 localStorage 读取，不碰 DOM。 -->
<script src="js/shell.js"></script>
</head>
<body>

<a class="skip" href="#main">跳到正文</a>

<!-- ============================================================
     右上角用户入口（标记写在 HTML 里，脚本挂了也看得见）
     未登录显示「登录」；有会话时由 js/auth-ui.js 换成用户名 + 下拉。
     <980px 时侧边栏变成顶部抽屉，本文件对应的 CSS 给 .nav-bar 留了右侧
     内边距，登录入口与 MENU 按钮不会叠在一起。

</div>

<nav class="nav" id="nav" aria-label="站点导航">

    <a class="nav-brand" href="index.html">
      <!-- 收起态只显示这一枚缩写（字由 js/shell.js 取站名首字写入） -->

      <span class="nav-brand-name" data-site-name>SIMON 的个人站</span>
      <span class="nav-brand-tag" data-site-sub>PERSONAL SITE</span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="navList">
      <span class="nt-bars" aria-hidden="true"><i></i><i></i></span>
      <span class="nt-text-closed">MENU</span>
      <span class="nt-text-open">CLOSE</span>
    </button>
    <!-- 桌面端收起/展开（与上面的 MENU 是两件事）：只改侧边栏宽度，
         展开是完整文字菜单、收起是 76px 图标栏，偏好写 localStorage。
         ≤980px 由 shell.css 隐藏，那一档交给 MENU 抽屉。 -->

      <svg class="nr-ic" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
        <rect x="2.6" y="3.6" width="14.8" height="12.8" rx="1.4"/>
        <path d="M8.2 3.6v12.8"/>
        <path class="nr-arrow" d="M12.9 8.1 10.9 10l2 1.9"/>
      </svg>
    </button>
  </div>

  <ul class="nav-list" id="navList">
    <li><a class="nav-link" href="about.html"><span class="nl-ic" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><circle cx="12" cy="8.6" r="3.6"/><path d="M4.8 19.6c.7-3.6 3.6-5.4 7.2-5.4s6.5 1.8 7.2 5.4"/></svg></span><span class="nl-en">ABOUT</span><span class="nl-cn">关于我</span></a></li>
    <li><a class="nav-link" href="archive.html" aria-current="page"><span class="nl-ic" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><rect x="3.6" y="4.6" width="16.8" height="14.8"/><path d="M7.2 9.4h9.6M7.2 12.6h9.6M7.2 15.8h5.6"/></svg></span><span class="nl-en">ARTICLES</span><span class="nl-cn">博客文章</span></a></li>
    <li><a class="nav-link is-todo" href="index.html" data-todo="待定"><span class="nl-ic" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><rect x="4.2" y="4.2" width="15.6" height="15.6" stroke-dasharray="3.2 3.2"/><circle cx="12" cy="12" r="1.6"/></svg></span><span class="nl-en">TBD</span><span class="nl-cn">待定</span></a></li>
  </ul>

  <div class="nav-foot">
    <a class="nav-back" href="index.html" data-tip="回到入口页"><span class="nb-arrow" aria-hidden="true">←</span><span class="nb-text">BACK TO ENTRY</span></a>
    <span data-year>© 2026 SIMON 的个人站</span>
  </div>
</nav>
<div class="nav-scrim" role="presentation"></div>

<div class="page">
  <main class="main" id="main">

    <!-- ============================================================
         首屏：与"关于我"同一套手法，几何装饰换一组母题
         （同心圆 → 方框与对角线，暗示"编目 / 归档"）
         ============================================================ -->
    <header class="hero">
      <div class="hero-inner">
        <span class="page-kicker">ARCHIVE</span>
        <h1 class="page-title">ALL<br>POSTS<span class="pt-cn">博 客 文 章</span></h1>
        <p class="page-lead">
          全部 <strong id="totalCount">0</strong> 篇。可按<strong>分类</strong>与<strong>标签</strong>交叉筛选，
          也可以切到<strong>时间线</strong>视图，按年月倒着看。
        </p>
      </div>

      <div class="hero-geo" aria-hidden="true">
        <svg viewBox="0 0 420 420" fill="none" focusable="false">
          <!-- 方框与对角线：编目的暗示 -->
          <g stroke="var(--g-rule-2)" stroke-width="1">
            <rect x="150" y="66" width="216" height="216"/>
            <rect x="186" y="102" width="144" height="144"/>
            <line x1="150" y1="66" x2="366" y2="282"/>
            <line x1="366" y1="66" x2="150" y2="282"/>
          </g>
          <!-- 红色斜条 -->
          <g fill="var(--g-red)">
            <rect x="34" y="92" width="118" height="10" transform="skewY(-18)"/>
            <rect x="34" y="124" width="84" height="10" transform="skewY(-18)" opacity=".72"/>
            <rect x="34" y="156" width="50" height="10" transform="skewY(-18)" opacity=".42"/>
          </g>
          <!-- 贯穿细线 -->
          <g stroke="var(--g-cyan)" stroke-width="1.2">
            <line x1="-20" y1="368" x2="440" y2="124"/>
            <line x1="-20" y1="394" x2="440" y2="150" opacity=".45"/>
          </g>
          <!-- 点阵 -->
          <g fill="var(--g-cyan-soft)" opacity=".55">
            <circle cx="176" cy="316" r="2"/><circle cx="198" cy="316" r="2"/><circle cx="220" cy="316" r="2"/>
            <circle cx="176" cy="338" r="2"/><circle cx="198" cy="338" r="2"/><circle cx="220" cy="338" r="2"/>
          </g>
        </svg>
      </div>
    </header>

    <!-- ============================================================
         筛选：分类（单选）+ 标签（多选，可叠加）
         维度之间是"与"；状态写进 URL 查询串，刷新与分享都能复现。
         全部由 js/archive.js 渲染并接管。

         版式是**两列**：左列是两个维度的精确开关（胶囊），
         右列是同一份标签数据的"词云"视图 —— 词云按篇数决定字号，
         由 archive.js 用"中心向外螺旋 + 矩形碰撞"逐个摆位填满矩形
         （不是换行排布：换行会留下大块空白，那是标签行不是词云）。
         ============================================================ -->
    <section class="filters" aria-labelledby="filterTitle">
      <h2 class="sr-only" id="filterTitle">筛选条件</h2>

      <div class="filter-pane">
        <div class="filter-row">
          <span class="filter-label" id="catLabel">分类</span>
          <div class="chips" id="catChips" role="group" aria-labelledby="catLabel"></div>
        </div>

        <div class="filter-row">
          <span class="filter-label" id="tagLabel">标签</span>
          <div class="chips" id="tagChips" role="group" aria-labelledby="tagLabel"></div>
        </div>
      </div>

      <!-- 词云：与左边的标签胶囊是**同一个维度**的两种画法 ——
           胶囊是精确开关，词云是按热度浏览（字号/颜色由该标签下的文章数决定）。
           两者共用 js/archive.js 里同一份 State.tags，点哪边都一样。
           整个云在"一个标签都没有"时由脚本隐藏。
           "全部"不在云里：它不参与热度缩放，放在抬头行更清楚（也避免
           让一个不按字号排的东西混进碰撞布局）。 -->
      <div class="cloud-box" id="cloudBox">
        <div class="cloud-head">
          <span class="filter-label" id="cloudLabel">标签云</span>
          <button class="tc-all" type="button" id="cloudAll" aria-pressed="true"
                  aria-label="全部文章：清空分类与标签筛选">全部<span class="tc-n" id="cloudAllN">0</span></button>
          <span class="cloud-note">字号 = 篇数 · 点词筛选</span>
        </div>
        <div class="tagcloud" id="tagCloud" role="group" aria-labelledby="cloudLabel"></div>
        <!-- 兜底行：极端窄的容器里可能有词摆不下（碰撞找不到位置），
             它们退到这里，保证每一个标签都仍然可点、不被藏起来 -->
        <div class="cloud-rest" id="cloudRest" hidden></div>
      </div>

      <div class="chip-row-aux">
        <span class="filter-count" id="filterCount" role="status" aria-live="polite"></span>
        <div class="view-switch" role="group" aria-label="视图切换">
          <button class="view-btn" type="button" id="viewList" aria-pressed="true">列表</button>
          <button class="view-btn" type="button" id="viewTimeline" aria-pressed="false">时间线</button>
        </div>
        <button class="filter-reset" type="button" id="filterReset" disabled>清空筛选</button>
      </div>
    </section>

    <!-- 列表视图：编号寄存器 —— 序号 / 标题 / 日期 / 摘要 / 分类与标签
         小节头与"关于我"逐字对齐（编号 + 中英标题 + 右侧备注 + 发丝线）：
         两页的节奏本来就该是同一条，间距一律取 shell.css 的 --ui-sect-gap，
         不再由每个 section 自带 inline style（那正是间距飘掉的原因）。 -->
    <section class="section" id="listSection" aria-labelledby="listTitle">
      <div class="section-head">
        <span class="section-num">01</span>
        <h2 class="section-title" id="listTitle">LIST<span class="st-cn">文章列表</span></h2>
        <span class="section-note">按时间倒序</span>
      </div>
      <div class="section-body">
        <div class="post-list" id="postList"></div>
      </div>
    </section>

    <!-- 时间线视图：年（描边大字）→ 月 → 篇 -->
    <section class="section" id="timelineSection" aria-labelledby="tlTitle" hidden>
      <div class="section-head">
        <span class="section-num">02</span>
        <h2 class="section-title" id="tlTitle">TIMELINE<span class="st-cn">时间线</span></h2>
        <span class="section-note">按年月归档</span>
      </div>
      <div class="section-body">
        <div class="timeline" id="timeline"></div>
      </div>
    </section>

  </main>

  <footer class="foot">
    <span class="f-brand" data-site-name>SIMON 的个人站</span>
    <span>落水而入 · 静态站点</span>
    <span class="f-right"><span data-foot-note>按 ESC 回主界面</span> · <span data-year>© 2026 SIMON 的个人站</span></span>
  </footer>
</div>

<script src="js/data.js" defer></script>
<script src="js/posts.js" defer></script>
<script src="js/archive.js" defer></script>
<script src="js/auth-ui.js" defer></script>
<script src="js/pages.js" defer></script>
</body>
</html>
