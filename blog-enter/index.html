<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENTER — 个人站</title>
<meta name="description" content="个人博客入口。坠入水中。">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="is-entry">

<!-- ============================================================
     折射滤镜（当前未被启用）
     ------------------------------------------------------------
     这是真正的水体折射：feTurbulence 生成噪声，feDisplacementMap 用它把
     整个"水下"世界扭一下。此前它被 body.is-underwater 无条件开启，但
     scale 一直是 0 —— 位移量为零 = 视觉上纯 no-op，代价却是每帧对整屏
     （还外扩 6%、滤镜区域再放大到 130%）重算一次湍流，而层里的焦散每帧
     都在变，所以这笔开销每帧都在付。已从 CSS 中移除。

     想启用：给 .refract 加 filter: url(#waterRefract)。
     成本提醒：feTurbulence 是逐像素噪声，1080p 下每帧都要重算，建议只在
     入水冲击这类短瞬间用（例如挂在 body.is-falling 上），别无脑常开。
     scale 是位移像素数，6~10 比较自然。
     ============================================================ -->
<svg class="defs-only" aria-hidden="true" focusable="false">
  <filter id="waterRefract" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
    <feTurbulence id="refractTurb" type="fractalNoise" baseFrequency="0.0016 0.009"
                  numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap id="refractDisp" in="SourceGraphic" in2="noise" scale="8"
                       xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<!-- ============================================================
     世界：白场 → 水面 → 水下
     ============================================================ -->
<div class="world" id="world">

  <!-- 水色背景。入场为纯白，坠落时反相为青蓝 -->
  <div class="water" id="water" aria-hidden="true">
    <div class="water-grain"></div>
  </div>

  <!-- 水面之上的强光带（阳光射入水面） -->
  <div class="sunbeams" id="sunbeams" aria-hidden="true"></div>

  <!-- 折射层：水波 Canvas 与（可选的）角色挂载点都在这一层
       Canvas 的 CSS 尺寸 = 视口；像素尺寸 = CSS × min(dpr, 1.5)；
       水波在更小的模拟网格上用波方程推进，再放大到这里（第五项）。 -->
  <div class="refract" id="refract">
    <canvas class="caustics-canvas" id="caustics" aria-hidden="true"></canvas>

    <!-- ============================================================
         角色挂载点（当前为空）
         ------------------------------------------------------------
         要用真实 Cubism 模型时，把 canvas 放进这里并实现
         data.js 里的 live2d.adapter.load()，挂载器默认用它作为舞台。
         ============================================================ -->
    <div class="char-stage" id="charStage"></div>
  </div>

  <!-- 气泡层（坠落时上升） -->
  <div class="bubbles" id="bubbles" aria-hidden="true"></div>

  <!-- 水面波光（横向掠过的光带） -->
  <div class="surface-sheen" id="sheen" aria-hidden="true"></div>

  <!-- ============================================================
       构成主义时钟 + 黑胶（第六项）
       ------------------------------------------------------------
       · 外圈：I–XII 罗马数字（JS 生成）+ 时针/分针，按现实时间走
       · 内圈：黑胶唱片持续旋转，中央是圆形裁切的专辑封面；
               没有音源时用内置占位封面与占位歌名（data.js 的 music 段）
       · 表盘语言取自构成主义（黑方盘 / 圆 / 对角楔形 / 分段色环 /
          斜线网点），配色接站点：红楔沿用站内 --red，描边与光环用天蓝
       · 层次（自下而上）：表盘纹理 → 表盘 / 色环 / 刻度 / 指针 →
          黑胶唱片 → 拖拽层：唱片视觉上盖住时针与分针（计时逻辑不变），
          最外圈持续扩散的光环留在最底层，从钟面背后扩出去
       · 3D：.dial-scene 只负责 perspective，#dialClock 与 #dialVinyl 是它的
          同级子元素，各持一份 transform —— 外层正倾、唱片反倾互不干扰
       · 可交互的只有折叠按钮、黑胶（点击播放 / 暂停）与拖拽落点；
          其余整块 pointer-events: none，不会和扇形菜单抢点击
       ============================================================ -->
  <aside class="dock" id="dock" aria-hidden="true">
    <button class="dock-toggle" id="dockToggle" type="button" aria-expanded="true"
            aria-label="收起时钟与播放信息">
      <span class="dt-face"><i class="dt-hand dt-h"></i><i class="dt-hand dt-m"></i></span>
    </button>
    <div class="dock-body">
      <div class="dial" id="dial" role="img" aria-label="时钟：当前时间 --:--">
        <!-- 视差背景 + 持续扩散的光环：都在最底层，不与黑胶一起做反向倾斜 -->
        <div class="dial-parallax" id="dialParallax" aria-hidden="true">
          <span class="dial-halo"></span>
        </div>
        <div class="dial-rings" aria-hidden="true">
          <i></i><i></i><i></i><i></i>
        </div>

        <!-- 3D 舞台：perspective 只在这里声明 -->
        <div class="dial-scene" id="dialScene">

          <!-- 外层时钟层：金属表圈 / 表盘 / 刻度 / 指针 / 阴影线 / 外围光圈 -->
          <div class="dial-clock" id="dialClock">
            <!-- 爆开光环：与扇形菜单的爆开同一瞬间启动 -->
            <span class="dock-burst" aria-hidden="true"><i></i><i></i><i></i></span>
            <!-- 表盘纹理层（CSS 画）：同心刻线、放射细线、斜向排线 -->
            <span class="dial-texture" aria-hidden="true"></span>
            <!-- 入场时扫过表圈的高光（只在首次入水播一次，JS 摘 .is-first） -->
            <span class="dial-sweep" aria-hidden="true"></span>

            <svg class="dial-svg" viewBox="0 0 240 240" aria-hidden="true" focusable="false">
              <defs>
                <pattern id="dialHatch" width="5" height="5" patternUnits="userSpaceOnUse"
                         patternTransform="rotate(45)">
                  <rect width="5" height="5" fill="#f2f0ea"></rect>
                  <line x1="0" y1="0" x2="0" y2="5" stroke="#0d0d0f" stroke-width="1.7"></line>
                </pattern>
                <pattern id="dialLineHatch" width="4" height="4" patternUnits="userSpaceOnUse"
                         patternTransform="rotate(45)">
                  <rect width="4" height="4" fill="#0b1a2b"></rect>
                  <line x1="0" y1="0" x2="0" y2="4" stroke="rgba(125, 211, 252, .55)"
                        stroke-width="1"></line>
                </pattern>
                <pattern id="dialRings" width="2.5" height="2.5" patternUnits="userSpaceOnUse">
                  <circle cx="1.25" cy="1.25" r=".75" fill="none"
                          stroke="rgba(125, 211, 252, .5)" stroke-width=".34"></circle>
                </pattern>
                <!-- 表盘挖掉 r<46 的圆：中心整块留给黑胶 -->
                <mask id="dialFaceMask">
                  <rect x="0" y="0" width="240" height="240" fill="#ffffff"></rect>
                  <circle cx="120" cy="120" r="46" fill="#000000"></circle>
                </mask>

                <!-- 金属表圈：左上高光 → 右下暗部，再叠一圈细密的明暗循环
                     做出拉丝金属的观感（线性渐变叠在同心环上比纯灰更"有金属味"） -->
                <linearGradient id="dialBezelMetal" x1="18%" y1="0%" x2="82%" y2="100%">
                  <stop offset="0" stop-color="#f4f8fb"></stop>
                  <stop offset=".14" stop-color="#9db4c6"></stop>
                  <stop offset=".3" stop-color="#e2ebf1"></stop>
                  <stop offset=".46" stop-color="#7b93a4"></stop>
                  <stop offset=".6" stop-color="#c2d2dd"></stop>
                  <stop offset=".76" stop-color="#5f7889"></stop>
                  <stop offset=".9" stop-color="#9fb3c2"></stop>
                  <stop offset="1" stop-color="#465c6b"></stop>
                </linearGradient>
                <radialGradient id="dialBezelSheen" cx="34%" cy="26%" r="72%">
                  <stop offset="0" stop-color="#dff2ff" stop-opacity=".85"></stop>
                  <stop offset=".45" stop-color="#8fd3f4" stop-opacity=".22"></stop>
                  <stop offset="1" stop-color="#0a2135" stop-opacity=".5"></stop>
                </radialGradient>

                <!-- 表盘底：米白盘面 + 从左上到右下的金属冷光过渡 -->
                <linearGradient id="dialFaceMetal" x1="12%" y1="0%" x2="88%" y2="100%">
                  <stop offset="0" stop-color="#ffffff"></stop>
                  <stop offset=".42" stop-color="#f3f0e9"></stop>
                  <stop offset="1" stop-color="#dbe3e8"></stop>
                </linearGradient>

                <!-- 厚度侧面：从盘面底部往下压暗 -->
                <linearGradient id="dialBplate" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0" stop-color="#27455c"></stop>
                  <stop offset=".55" stop-color="#132b3e"></stop>
                  <stop offset="1" stop-color="#040b12"></stop>
                </linearGradient>

                <!-- 盘面内阴影：上缘 + 两侧的投影，做出"指针沉在盘里"的凹陷感。
                     userSpaceOnUse + 用户坐标，跟随 viewBox 缩放，不需要额外缩放层 -->
                <clipPath id="dialInnerClip">
                  <circle cx="120" cy="121" r="93"></circle>
                </clipPath>
                <filter id="dialInnerShadow" x="-25%" y="-25%" width="150%" height="150%"
                        color-interpolation-filters="sRGB">
                  <feDropShadow dx="0" dy="5" stdDeviation="6"
                                flood-color="#03131f" flood-opacity=".6"></feDropShadow>
                  <feDropShadow dx="0" dy="1.5" stdDeviation="2"
                                flood-color="#03131f" flood-opacity=".45"></feDropShadow>
                </filter>
              </defs>

              <!-- ① 厚度侧面：被盘面整体压住，只有倾斜时才从上缘露出来 -->
              <circle class="dial-bplate" cx="120" cy="128" r="114.5"></circle>

              <!-- ② 金属表圈：r 96~120（外径占容器 83%），叠高光与冷色环境光 -->
              <circle class="dial-bezel" cx="120" cy="120.5" r="112" fill="none"
                      stroke="url(#dialBezelMetal)" stroke-width="16"></circle>
              <circle class="dial-bezel-sheen" cx="120" cy="120.5" r="112" fill="none"
                      stroke="url(#dialBezelSheen)" stroke-width="16"></circle>
              <!-- 滚花细齿：JS 生成，只在表圈带内，做出机械倒角 -->
              <g class="dial-knurl" mask="url(#dialFaceMask)"></g>
              <!-- 倒角高光（外缘）与倒角阴影（内缘）：一明一暗才是"圆弧倒角" -->
              <circle class="dial-bezel-hi" cx="120" cy="120.5" r="119.6" fill="none"></circle>
              <circle class="dial-bezel-lo" cx="120" cy="120.5" r="104.2" fill="none"></circle>

              <!-- ③ 盘面：r 51~93（下移 1 单位 = 表圈在上的光学厚度）。
                     94 比表圈内缘 96 略大，让内阴影压出一圈凹陷 -->
              <circle class="dial-face" cx="120" cy="121" r="74" fill="none"
                      stroke="url(#dialFaceMetal)" stroke-width="44"></circle>
              <!-- 表盘冷色微光：与外圈天蓝呼应，中心淡出 -->
              <circle class="dial-face-glow" cx="120" cy="121" r="74" fill="none"
                      stroke="rgba(56, 189, 248, .4)" stroke-width="44"></circle>
              <!-- 同心刻线图案（pattern 为用户坐标，跟 viewBox 一起缩放） -->
              <circle class="dial-face-rings" cx="120" cy="121" r="74" fill="none"
                      stroke="url(#dialRings)" stroke-width="44"></circle>
              <!-- 内阴影：把盘面到表圈的那一圈压暗，做出下沉 -->
              <g clip-path="url(#dialInnerClip)">
                <circle class="dial-shadow-rim" cx="120" cy="120" r="99" fill="none"
                        filter="url(#dialInnerShadow)"></circle>
              </g>

              <!-- ④ 四象限分段色环（r 86、线宽 14 → 覆盖 79~93） -->
              <path class="dial-q dial-q1" d="M120 35 A85 85 0 0 1 205 120"></path>
              <path class="dial-q dial-q2" d="M205 120 A85 85 0 0 1 120 205"></path>
              <path class="dial-q dial-q3" d="M120 205 A85 85 0 0 1 35 120"></path>
              <path class="dial-q dial-q4" d="M35 120 A85 85 0 0 1 120 35"></path>
              <!-- 色环两侧的分隔细线：上缘亮、下缘暗，让色环像嵌进盘面的嵌条 -->
              <circle class="dial-seam-hi" cx="120" cy="120" r="95.6" fill="none"></circle>
              <circle class="dial-seam-lo" cx="120" cy="120" r="79.2" fill="none"></circle>
              <!-- 盘面内缘圈：黑胶就坐在它里面，给唱片一圈冷光底衬 -->
              <circle class="dial-rim" cx="120" cy="120" r="51.5" fill="none"></circle>

              <!-- 放射状阴影线（r 53~90）：JS 按 3° 生成，只压一道极淡的机械质感 -->
              <g class="dial-rails" mask="url(#dialFaceMask)"></g>

              <!-- 构成主义对角线 + 两个角上的短棒 -->
              <line class="dial-diagonal" x1="56" y1="185" x2="184" y2="56"></line>
              <line class="dial-corner-red" x1="52" y1="54" x2="66" y2="40"></line>
              <line class="dial-corner-sky" x1="176" y1="198" x2="190" y2="184"></line>

              <!-- 罗马数字由 JS 生成（r=76） -->
              <g id="dialNumerals" class="dial-numerals"></g>

              <!-- 时针 / 分针：造型参照附图的老式镂空指针（卷草纹 + 长尾配重） -->
              <g id="dialHour" class="dial-hand-h">
                <path class="dial-hand-shape" transform="translate(0 -6)" d="M120 58.08 C117.94 68.4 115.18 78.38 112.43 84.05 C109.34 90.42 104.69 93.17 99.53 92.91 C94.8 92.65 90.76 90.16 88.7 85.94 C85.6 79.41 88.01 72.18 92.82 66.51 C97.64 60.83 103.23 56.27 107.44 52.75 C109.85 50.68 112.95 50.34 115.01 52.06 C116.9 53.61 119.14 55.84 120 58.08 Z M120 58.08 C122.06 68.4 124.82 78.38 127.57 84.05 C130.66 90.42 135.31 93.17 140.47 92.91 C145.2 92.65 149.24 90.16 151.3 85.94 C154.4 79.41 151.99 72.18 147.18 66.51 C142.36 60.83 136.77 56.27 132.56 52.75 C130.15 50.68 127.05 50.34 124.99 52.06 C123.1 53.61 120.86 55.84 120 58.08 Z"></path>
                <circle class="dial-hand-boss" cx="120" cy="120" r="9.6"></circle>
                <circle class="dial-hand-pierce" cx="120" cy="120" r="3.6"></circle>
              </g>
              <g id="dialMin" class="dial-hand-m">
                <path class="dial-hand-shape" transform="translate(0 -6)" d="M120 114.5 L120 26.5 C120 22.4 121.9 19.2 124.5 18.1 L127.6 16.8 L126.6 39 L126 114.5 Z M120 114.5 L120 26.5 C120 22.4 118.1 19.2 115.5 18.1 L112.4 16.8 L113.4 39 L114 114.5 Z M120 133 L120 128.5 C117.4 128.5 114.8 127.3 112.9 124.9 C110.2 121.5 108.7 116.4 108.2 110.8 C107.9 107.8 109.3 105.5 111.9 104.9 C114.5 104.3 117.4 105.8 118.4 108.4 C119.1 110.2 120 111.4 120 111.4 Z M120 133 L120 128.5 C122.6 128.5 125.2 127.3 127.1 124.9 C129.8 121.5 131.3 116.4 131.8 110.8 C132.1 107.8 130.7 105.5 128.1 104.9 C125.5 104.3 122.6 105.8 121.6 108.4 C120.9 110.2 120 111.4 120 111.4 Z"></path>
                <circle class="dial-hand-boss" cx="120" cy="120" r="7.8"></circle>
                <circle class="dial-hand-pierce" cx="120" cy="120" r="2.8"></circle>
              </g>
              <circle class="dial-pivot" cx="120" cy="120" r="6.4"></circle>
              <rect class="dial-pivot-dot" x="116" y="116" width="8" height="8"
                    transform="rotate(45 120 120)"></rect>
            </svg>
          </div>
          </div>

          <!-- 黑胶层：与外层时钟同级 → 可独立做反向倾斜；
               放在时钟层之后 → 视觉上直接盖住时针与分针 -->
          <div class="dial-vinyl" id="dialVinyl">
            <div class="vinyl" id="vinyl" role="group" aria-label="播放信息：暂无播放">
              <span class="vinyl-disc"><span class="vinyl-cover" id="vinylCover"></span></span>
            </div>
            <!-- 拖拽落点：圆形，正好罩住唱片 -->
            <div class="dial-drop" id="dialDrop" role="button" tabindex="-1"
                 aria-label="把本地音频文件拖到这里播放"></div>
          </div>
        </div>
      </div>
      <div class="vinyl-meta">
        <span class="vinyl-title" id="vinylTitle">暂无播放</span>
        <span class="vinyl-sub" id="vinylSub">NO TRACK</span>
      </div>
    </div>
  </aside>
  <!-- ============================================================
       扇形放射菜单
       ============================================================ -->
  <nav class="fan" id="fan" aria-label="站点导航">
    <ul class="fan-list" id="fanList"></ul>
  </nav>

  <!-- 底部命令提示 -->
  <footer class="cmdbar" id="cmdbar">
    <div class="cmd-label">
      <span class="cmd-jp" id="cmdJp">メニュー</span>
      <span class="cmd-en" id="cmdEn">Command</span>
    </div>
    <div class="cmd-keys">
      <span class="ck"><b>ENTER</b>決定</span>
      <span class="ck"><b>ESC</b>閉じる</span>
    </div>
  </footer>

  <!-- 左下角署名 -->
  <div class="credit" id="credit"></div>
</div>

<!-- ============================================================
     入场提示（纯白页面 + 极简空心箭头）
     ------------------------------------------------------------
     · 三段文案按 180ms 依次淡入（见 CSS 的 entryIn），总时长 860ms
     · 文案在箭头上方；箭头是 <button>，天然可聚焦、可回车
     · 标题上的 data-text 是给 ::after 做"字形遮罩"用的同一段文字，
       两者必须完全一致，否则波线会错位（见 CSS 的 .entry-name::after）
     ============================================================ -->
<div class="entry" id="entry">
  <div class="entry-inner">
    <div class="entry-name" id="entryName" data-text="YOUR&nbsp;NAME">YOUR&nbsp;NAME</div>
    <p class="entry-tag">PERSONAL&nbsp;SITE&nbsp;/&nbsp;落水而入</p>
    <p class="entry-hint"><span class="k">ENTER</span> 或 <span class="k">滚轮下滑</span></p>
    <button class="enter-arrow" id="enterArrow" type="button" aria-label="进入">
      <svg class="arrow-svg" viewBox="0 0 40 56" aria-hidden="true" focusable="false">
        <path d="M20.6 5.2 C 20.2 18.4 19.6 30.6 20.1 47.6"></path>
        <path d="M8.4 34.8 C 12.6 39.9 16.3 44.1 20.1 49.4"></path>
        <path d="M31.9 34.1 C 27.6 39.4 23.8 43.8 20.1 49.4"></path>
      </svg>
    </button>
  </div>
</div>

<!-- 坠落时的白闪 / 入水冲击 -->
<div class="flash" id="flash" aria-hidden="true"></div>

<script src="js/data.js" defer></script>
<script src="js/character.js" defer></script>
<script src="js/water.js" defer></script>
<script src="js/dock.js" defer></script>
<script src="js/menu.js" defer></script>
<script src="js/boot.js" defer></script>
</body>
</html>
