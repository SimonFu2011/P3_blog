# ==== P3_blog 规则开始（贴进 宝塔 → 网站 → 设置 → 伪静态）====
#
# 为什么贴"伪静态"而不是改主配置：
#   宝塔的伪静态文件是 include 在 server 块最前面的，而 nginx 的正则 location
#   是"先出现先匹配"。放在这里，下面这些规则就会赢过面板默认的
#       location ~ .*\.(js|css)?$ { expires 12h; }
#   面板在做切换 SSL / 改运行目录 / 改站点目录等操作时**会重新生成主配置**，
#   伪静态文件不会被覆盖，所以规则放这里更耐用。
#
# ⚠️ 这条规则对本项目是必须的，不是优化：
#   js/posts.js 装的是**文章正文**，不是"代码资源"。
#   面板默认给它 12 小时缓存 —— 你发完新文章，自己刷不出来，
#   还会以为是发布失败了。

# ---- 第一道防线：管理端与后端源码一律不存在 ----
# admin/ 是本地写作工具的界面，server/ 是只绑 127.0.0.1 的本地服务。
# 发布脚本本来就排除了它们，这里再挡一层（^~ 优先于正则，不会被下面抢走）。
location ^~ /admin/  { return 404; }
location ^~ /server/ { return 404; }
location ~* \.(mjs|cjs)$ { return 404; }
# 带下划线的那个也要挡：本机管理页的地址是 /_admin/，而 ^~ /admin/ 只匹配
# "/admin/…"，匹配不到 "/_admin/…"（下划线不是斜杠）。现在它 404 只是因为
# 文件恰好没被发布；万一有人再把管理端目录拷进站点根，就会直接对外可读。
location ^~ /_admin/ { return 404; }

# ---- 缓存 ----
# 资源文件名没有内容哈希，所以不能用长缓存。
location ~* \.html$ { expires -1; }                    # 每次都回源校验
location ~* \.(js|css)$ { expires 5m; }                # posts.js 属于"内容"
location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|avif|woff2?)$ { expires 7d; }

# ---- 404 页面 ----
# 如果面板主配置里已经有生效的 error_page 404，请删掉这一行（重复会报错）。
error_page 404 /404.html;

# ---- 安全头 ----
# add_header 不继承：只要某个 location 里出现一条 add_header，
# 同一 server 块里的这些就全作废。所以本站的 location 一律用 expires 做缓存，
# 不要在这些 location 里写 add_header，否则等于把安全头关掉。
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# ---- 可选：让 /about 这种无扩展名地址也能打开 ----
# 站点本身不依赖它。若面板主配置里已经定义了 location /，这里会撞成
# "duplicate location"；引导脚本检测到 nginx -t 失败时会自动删掉这一段重试。
# ---- 可选开始 ----
location / { try_files $uri $uri/ $uri.html =404; }
# ---- 可选结束 ----

# ==== P3_comments 开始（Waline 评论服务）====
# 整段 /comments/ 都反代给 Waline：接口 /comments/api/、后台 /comments/ui/、
# 邮件里的验证链接 /comments/verification，都是**它自己注册的路由**。
# 逐个 location 列举看着更"精确"，但只要 Waline 加一条路由就会静默 404
# —— 方案的原文就是这样，而且它连 /verification 都没覆盖到。
#
# 所以评论的客户端资源（waline.js / waline.css / waline-admin.js）**不放在这里**：
# 它们在站点的 /comments-assets/ 下，由静态规则提供。放进来会被一起转给 Waline。
#
# proxy_pass 结尾的那个 / 不能省：它把 /comments 前缀剥掉。不剥的话 Waline 收到
# /comments/api/comment，而它的接口前缀是 /api/ → 404。
#
# X-Forwarded-For 用 $remote_addr 覆盖而不是 append：
#   thinkjs 开了 proxy=true，会取 XFF 的值当客户端 IP。append 的话攻击者自己
#   带一个 XFF 就能随意伪造 IP，把 Waline 的 IPQPS 限流绕过去。
location ^~ /comments/ {
    proxy_pass http://127.0.0.1:8360/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
    proxy_read_timeout 60s;
}

# 评论后台：只允许从服务器本机访问（走 SSH 隧道，见 blog-enter/ADMIN.md 第 8 节）。
# 对外暴露管理面没有意义，还给人撞库的机会。
location ^~ /comments/ui/ {
    allow 127.0.0.1;
    deny all;
    proxy_pass http://127.0.0.1:8360/ui/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
}

# 【临时】注册接口只允许本机：Waline 的**第一个注册账号自动是管理员**，
#   在管理员抢注完成之前，绝不能让公网有机会注册。
#   你通过隧道直连 127.0.0.1:8360 注册，不经过 nginx，所以不受这条影响。
#   ⚠️ 管理员注册完、要开放"邮箱验证码注册"时，**删掉这一段**。
location = /comments/api/user {
    allow 127.0.0.1;
    deny all;
    proxy_pass http://127.0.0.1:8360/api/user;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
}

# 不对外提供 Waline 自带那个演示页（它自己会去 unpkg 拉资源，我们不用它）
location = /comments/ { return 404; }
# ==== P3_comments 结束 ====

# ==== P3_blog 规则结束 ====
