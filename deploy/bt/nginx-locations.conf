# ==== P3_blog 规则开始（贴进 宝塔 → 网站 → 设置 → 伪静态）====
#
# 为什么贴"伪静态"而不是改主配置：
#   宝塔的伪静态文件是 include 在 server 块最前面的，而 nginx 的正则 location
#   是"先出现先匹配"。放在这里，下面这些规则就会赢过面板默认的
#       location ~ .*\.(js|css)?$ { expires 12h; }
#   面板在做切换 SSL / 改运行目录 / 改站点目录等操作时**会重新生成主配置**，
#   伪静态文件不会被覆盖，所以规则放这里更耐用。
#
# ⚠️ 这条规则对本项目是必须的，不是优化：
#   js/posts.js 装的是**文章正文**，不是"代码资源"。
#   面板默认给它 12 小时缓存 —— 你发完新文章，自己刷不出来，
#   还会以为是发布失败了。

# ---- 第一道防线：管理端与后端源码一律不存在 ----
# admin/ 是本地写作工具的界面，server/ 是只绑 127.0.0.1 的本地服务。
# 发布脚本本来就排除了它们，这里再挡一层（^~ 优先于正则，不会被下面抢走）。
location ^~ /admin/  { return 404; }
location ^~ /server/ { return 404; }
location ~* \.(mjs|cjs)$ { return 404; }
# 带下划线的那个也要挡：本机管理页的地址是 /_admin/，而 ^~ /admin/ 只匹配
# "/admin/…"，匹配不到 "/_admin/…"（下划线不是斜杠）。现在它 404 只是因为
# 文件恰好没被发布；万一有人再把管理端目录拷进站点根，就会直接对外可读。
location ^~ /_admin/ { return 404; }

# ---- 第二道闸：Node 构建物与依赖清单也不对外（**不是**发布排除的替代）----
# 发布脚本已经用 --filter='-s /server/' 把 server/ 整棵子树挡在外面，
# 所以经 blog-publish 上线的产物里本来就不会有这些东西。但那条只管
# "经发布脚本上线"一条路径：手工 rsync、整站快照还原、换发布方式都会绕过它。
# 这里再挡一层，同时与 deploy/nginx/blog.conf 的既有规则对齐
# （另一套部署模板早就有 node_modules 那条，两套模板在这点上原本不一致）。
#   · /node_modules/ 用 ^~ 前缀：覆盖任意深度；而且 ^~ 优先于正则，不会被
#     下面 ~* \.(js|css)$ 的缓存规则先吃掉（已用真机探针验过 /js/posts.js 正常）。
#   · 依赖清单用**正则家族**而不是精确匹配：下次换包管理器（yarn / pnpm）
#     或留下 npm 调试日志时不会再漏一个。
#     ⚠️ 该正则锚定在站点根（^/…$）—— 那正是发布脚本会散落文件的位置；
#        嵌套目录里的同名文件不在其内（将来若要覆盖，改 ^/.*…$ 即可）。
# ⚠️ 这是第二道闸，不是放宽 rsync 排除的理由：发布排除必须保持。
location ^~ /node_modules/ { return 404; }
location ~* ^/(package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|npm-debug\.log)$ { return 404; }

# ---- 缓存 ----
# 资源文件名没有内容哈希，所以不能用长缓存。
location ~* \.html$ { expires -1; }                    # 每次都回源校验
location ~* \.(js|css)$ { expires 5m; }                # posts.js 属于"内容"
location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|avif|woff2?)$ { expires 7d; }

# ---- 404 页面 ----
# 如果面板主配置里已经有生效的 error_page 404，请删掉这一行（重复会报错）。
error_page 404 /404.html;

# ---- 安全头 ----
# add_header 不继承：只要某个 location 里出现一条 add_header，
# 同一 server 块里的这些就全作废。所以本站的 location 一律用 expires 做缓存，
# 不要在这些 location 里写 add_header，否则等于把安全头关掉。
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# ---- CSP（审计 S8）：先 Report-Only，观察一周再改强制 ----
# 为什么先 Report-Only：CSP 是"只在违规时才生效"的控制，配错的表现是页面某块
# 静默失效（脚本不执行、图不显示），在浏览器控制台之外很难发现。先只上报，
# 确认没有违规再改成 `Content-Security-Policy`（去掉 -Report-Only 即可）。
#
# 为什么加在**这个位置**（server 块级、所有 location 之前）：
# add_header 不继承 —— 任何 location 里出现一条 add_header，本 server 块里
# 上面那三条安全头就会全部作废（第 53-55 行的既有教训）。所以 CSP 与它们放在一起，
# 且**不要**为了省事写进某个 location。
#
# 策略逐项理由：
#   default-src 'self'     默认只信自己，等于"没列的都拒"
#   script-src  'self'     页面脚本全是外链（实测该站 5 个页面只有 404.html 有 1 个内联）
#   style-src   'self' 'unsafe-inline'
#                          页面里有 style="…" 内联样式（archive.html 用了 clamp() 算间距），
#                          去掉这条会破坏布局；内联样式的 XSS 面远小于内联脚本
#   img-src     'self' data:  头像用 data:image/*（comments.js 只接受 data: 或同源）
#   connect-src 'self'     前端只打 /api/*
#   base-uri/form-action/frame-ancestors/object-src
#                          全部锁死：防 <base> 劫持、防跨站表单外发、防被嵌套、防插件
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-hYOyioQ9GfQfnJv4xh6Ewrh3HPmlKcVC0sXdC6HeEDc='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
# 上面 script-src 里的 sha256-… 对应 blog-enter/404.html 里那**唯一一个**内联脚本
# （填"你访问的路径"）。改那个脚本的任何字节都会让这个 hash 失效（CSP 只上报、
# 不拦，所以症状是"404 页少了路径提示"，不是白屏）。
# 若想省掉这个 hash：把那段脚本挪到独立 .js 文件并按 <script src> 引入即可。
# 重新计算方式：把 <script> 与 </script> 之间的字节按 UTF-8 取 SHA-256 → base64。

# ---- 可选：让 /about 这种无扩展名地址也能打开 ----
# 站点本身不依赖它。若面板主配置里已经定义了 location /，这里会撞成
# "duplicate location"；引导脚本检测到 nginx -t 失败时会自动删掉这一段重试。
# ---- 可选开始 ----
location / { try_files $uri $uri/ $uri.html =404; }
# ---- 可选结束 ----

# ==== P3_comments 已停用（Waline 反代）====
# 【为什么停用，而不是留着】审计 S2：`p3_uid` 会话 cookie 原来 Path=/，作用域是整个
# host，于是每一次 `http://<host>/comments/*` 请求都会把 `Cookie: p3_uid=<会话令牌>`
# 交给 Waline 进程。Waline 是自托管的第三方应用（自带用户体系与历史 CVE），
# 它**在服务端就能读到这个头** —— HttpOnly 在这条路径上完全无效。
# 会话是 bearer 型、有效期 30 天，被读走一次即等于账号被接管。
#
# 现在评论已改由自建服务提供（/api/comments* → 127.0.0.1:8850），Waline 不再被引用，
# 所以整段反代直接**删除**（不是注释掉留给别人一键放开）：
# 留一段"看起来能用"的反代，等于把上面那条风险留在配置里等下一次误启用。
#
# 【Waline 数据不删】/srv/waline/data/waline.sqlite 与 p3-waline.service 原样保留，
# 历史评论仍可离线导出；只是公网不再有它的入口。
#
# 【回滚（要重新启用 Waline 评论时）】
#   1) 把下面这段恢复（原样在 git 历史里：`git log -p -- deploy/bt/nginx-locations.conf`）：
#        location ^~ /comments/ { proxy_pass http://127.0.0.1:8360/; … }
#        location ^~ /comments/ui/ { allow 127.0.0.1; deny all; … }
#        location = /comments/api/user { allow 127.0.0.1; deny all; … }
#   2) systemctl start p3-waline（若已停用）
#   3) nginx -t && nginx -s reload
#   4) 同时把前端恢复成引用 comments-assets/waline.js（见
#      blog-enter/comments-assets/README.md 的回滚小节）
#   ⚠️ 回滚第 4 步之前，cookie Path 已经是 /api（更安全），
#      所以"Waline 能读到 p3_uid"这条风险不会因为回滚第 1 步而回来。
#
# 只保留一条"明确不存在"的兜底：/comments/ 若被别处引用，回 404 而不是落到
# 面板默认规则（那条会把请求交给静态文件处理器，可能撞出目录列举之类的东西）。
location = /comments/ { return 404; }
location ^~ /comments/ { return 404; }
# ==== P3_comments 结束 ====

# ==== P3_public API 开始（公开登录 / 注册 / 评论 → Node 服务 127.0.0.1:8850）====
# 后端：deploy/systemd/p3-public.service（只绑回环 8850）；数据在 MySQL 库 p3blog。
#
# 【为什么这里逐个 location 列举，而不是 location /api/ 整段反代】
#   上面 /comments/ 整段反代，是因为 Waline 自己注册路由、漏一条就静默 404。
#   公开 API 不同：路由表是我们**冻结的 9+1 条**
#   （blog-enter/server/CONTRACT-public-api.md），它不会自己长出新路径。
#   整段 /api/ 反代等于把"哪些路径对外存在"交给 nginx 猜：哪天服务里多一条
#   内部或实验性路径，它就自动上了公网。所以这里只放行明确列举的路径，
#   其余 /api/* 一律 404（见本节末尾的兜底段）。
#
# 【proxy_pass 结尾**不能**加 `/`】
#   与 Waline 段正好相反：那段靠结尾的 `/` 把 /comments 前缀剥掉，这里必须
#   原样把 URI 交给后端（后端按 /api/... 全路径路由）。一旦在 `:8850` 后面
#   多写一个斜杠，就变成了"带 URI 的 proxy_pass"，nginx 会用 location 匹配段
#   去替换 URI —— location = /api/auth/me 会被改写成 `/` → 后端 404。
#   本节所有 proxy_pass 都是干净的 `http://127.0.0.1:8850`（没有路径部分）。
#
# 【X-Forwarded-For：追加，不覆盖】
#   后端以 --trust-proxy 启动，取 XFF 的**最后一段**（lib/security.mjs::clientIp），
#   也就是 nginx 这里追加的 $remote_addr；客户端自己塞的伪造值排在前面、被忽略。
#   所以这里用 $proxy_add_x_forwarded_for 是安全的。
#   （Waline 段用 $remote_addr 覆盖，是因为 thinkjs 取的是别的段位 ——
#     两段写法不同不是笔误；改任何一段前先看后端怎么取。）
#   ⚠️ 这两件事是一对：后端一旦关掉 --trust-proxy，XFF 就完全不被采信
#     （限流退化成全站共享一个桶）；nginx 这里若改成覆盖，客户端伪造的 IP
#     就会进审计与限流键。
#
# 【Host 必须原样传 $host】
#   后端 Host 白名单里只加了 43.108.100.116（单元文件的 --public-host）；
#   传成 127.0.0.1 会被判 "host not allowed" → 403。
#
# 【不要加 proxy_intercept_errors on】
#   server 级有一条 error_page 404 /404.html。默认（proxy_intercept_errors off）
#   后端的 404 会原样透传 —— 契约要求 DELETE /api/comments/<不存在的 id> 回
#   JSON 404，这正是我们要的。一旦打开 intercept，nginx 会用那张 HTML 404 页
#   替掉 JSON 响应体，契约就破了。
#
# 【限流：nginx 只做兜底，默认关闭】
#   应用自己有两道闸（HTTP 层内存窗口 + 库内 auth_throttle，阈值见契约 §0.6）。
#   这里再叠一层是防"机器洪水"，不是主闸。启用要两步：
#   ① zone 必须定义在 **http{}** 里，而本文件是 include 在 server{} 内的 ——
#      limit_req_zone 写在这里会让 nginx -t 直接报错（把面板上所有站点一起搞挂）。
#      加在 /www/server/nginx/conf/nginx.conf 的 http{} 中：
#          limit_req_zone $binary_remote_addr zone=p3auth:10m rate=60r/m;
#          limit_req_zone $binary_remote_addr zone=p3api:10m  rate=120r/m;
#      rate=60r/m 即 1 请求/秒/IP，比应用自己的 auth.login（每 IP 15 分钟 10 次）
#      宽得多：应用是主闸，这里只挡洪水。注册/登录建议 p3auth，评论读写建议 p3api。
#   ② 再把下面各段里那两行注释解开（读接口建议不开：正常刷新/翻页不该被限）：
#          limit_req zone=p3auth burst=20 nodelay;
#          limit_req_status 429;
#   ③ nginx 的 429 是 HTML 错误页，不是契约里的 JSON 形状 —— 前端按状态码兜底即可，
#      不要让它去解析这一层的响应体。
#
# 【请求体上限】应用在 1 MiB 处回契约里的结构化 413（边读边判）。
#   nginx 这层只做**更粗**的兜底 = 2m：这样 1m~2m 之间仍由应用给出契约 JSON，
#   超过 2m 才在 nginx 被掐断（HTML 错误页）。别把这里设成 1m：
#   那会让契约里那条 413 BODY_TOO_LARGE 永远走不到。
#
# 【共享密钥：证明请求确实来自我们这份 nginx（与 --trust-proxy 成对）】
#   问题：--trust-proxy 让后端相信 X-Forwarded-For。但 8850 只绑回环，
#   本机任何进程（被入侵的低权限服务、某个 SSRF）都能直连它并自己塞
#   "X-Forwarded-For: 1.2.3.4"。因为后端取**最后一段**，它就能任意伪造客户端 IP：
#   限流被逐个假 IP 绕过（等于没有限流），auth_log 记假 IP。
#   管理面早就用同一套机制解决（lib/security.mjs 里的代理密钥校验 + nginx 注入
#   X-Admin-Proxy-Secret），公开服务必须带上这半个机制。
#   → 下面每条指向 8850 的 location 都 include 了同一行，把密钥头注入后端；
#     后端（--proxy-secret-file）比对不上就拒绝，直连者不掌握密钥故无法伪造。
#
#   /etc/p3blog/public-proxy-header.conf 的全部内容就一行（不要放别的指令）：
#       proxy_set_header X-Admin-Proxy-Secret "<openssl rand -hex 32 的结果>";
#   生成命令与权限见 deploy/PLAN-PUBLIC-LOGIN.md 第 4 步。
#   文件缺失时 nginx -t 会直接失败（fail-closed：reload 不执行、线上保持原状），
#   所以顺序永远是「先建文件 → 再 nginx -t → 再 reload」。
#
# 【为什么用 include，而不是 map / perl / lua（都是实测过的取舍）】
#   · perl_set：`nginx -V` 显示这份 nginx **没有** --with-http_perl_module → 不可用。
#   · map：只能在 http{} 里定义，而本文件是 include 在 server{} 内的 → 写在这里
#     会让 nginx -t 报错（还会把面板上所有站点一起搞挂）。
#   · lua（这份是 OpenResty，lua 模块在）：请求期读文件要由 **worker 用户**读，
#     实测 worker 是 www → 密钥文件就得放宽到 644 或 chown www，等于把密钥交给
#     同机所有低权限用户，比放进 root-only 的配置文件还差。
#   · include：由 **root 的 master 在配置解析期**读取（本伪静态文件本身就是
#     600 root:root，同一层信任），所以密钥文件可以保持 600 root:root ——
#     值不落仓库，也不给 www/blog 之外的任何用户看到。
#
#   ⚠️ 这一行与后端 --trust-proxy 是**一对**，改一个必须改另一个：
#     · 只开 --trust-proxy、不注入密钥 → 本机任意进程都能伪造客户端 IP（限流形同虚设）
#     · 只注入密钥、不开 --trust-proxy → 后端根本不看 XFF，所有请求对端都是
#       127.0.0.1，限流退化成全站共享桶（任何人连错 10 次锁死所有人一小时）
#   注入是**覆盖**语义：客户端自己带的同名头会被这一行替换掉（已在服务器实测）。

# ---- 认证：4 个精确路径（契约 §1.1 ~ §1.4）----
location = /api/auth/me {
    include /etc/p3blog/public-proxy-header.conf;   # X-Admin-Proxy-Secret：证明来自本机 nginx
    proxy_pass http://127.0.0.1:8850;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
    proxy_read_timeout 60s;
    # limit_req zone=p3auth burst=20 nodelay;
    # limit_req_status 429;
}

location = /api/auth/register {
    include /etc/p3blog/public-proxy-header.conf;   # X-Admin-Proxy-Secret：证明来自本机 nginx
