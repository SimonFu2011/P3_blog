# ---- 评论（契约 §1.5 ~ §1.7、§2.1）----
# 列表与新建共用一条精确路径：GET /api/comments?slug=… 与 POST /api/comments。
location = /api/comments {
    include /etc/p3blog/public-proxy-header.conf;   # X-Admin-Proxy-Secret：证明来自本机 nginx
    proxy_pass http://127.0.0.1:8850;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
    proxy_read_timeout 60s;
    # limit_req zone=p3api burst=40 nodelay;
    # limit_req_status 429;
}

# 「我的评论」。它是静态段、不是 :id，精确匹配本来就赢过正则；
# 单独写出来是为了让读的人一眼看到这条也在白名单里（漏了它前端下拉会 404）。
location = /api/comments/mine {
    include /etc/p3blog/public-proxy-header.conf;   # X-Admin-Proxy-Secret：证明来自本机 nginx
    proxy_pass http://127.0.0.1:8850;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
    proxy_read_timeout 60s;
}

# 删除：唯一一条带路径参数的接口，只能靠正则。
# 形状与契约 §1.7 的 ^[1-9][0-9]{0,18}$ 对齐（无前导零、最长 19 位）。
# 不写成 [0-9]+：那会把 /api/comments/007 也放进白名单，
# 而后端只会回 404 —— 白名单里不留这种"看着能通"的路径。
# ⚠️ 正则必须**加双引号**：nginx 的配置分词器把 `{` `}` 当块分隔符，
#    不加引号的 {0,18} 会被切成新 token，nginx -t 直接报
#    unknown directive "0,18}$"（已在服务器上用 nginx 1.28.3 实测复现）。
location ~ "^/api/comments/[1-9][0-9]{0,18}$" {
    include /etc/p3blog/public-proxy-header.conf;   # X-Admin-Proxy-Secret：证明来自本机 nginx
    proxy_pass http://127.0.0.1:8850;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
    proxy_read_timeout 60s;
    # limit_req zone=p3api burst=40 nodelay;
    # limit_req_status 429;
}

# ---- 访问统计（契约 §1.8 / §1.9）----
# 两条路径分工明确，别合并：
#   POST /api/stats/hit  记一次访问并返回汇总（前端每个页面打一次）
#   GET  /api/stats      只读汇总，不计数（排障 / 将来的看板用）
# 为什么用 = 精确匹配而不是前缀：与本节其它条目同一个理由 —— 白名单里
# 不留"看着能通"的路径，/api/stats/anything 依然落到末尾的 404。
# 前端在拿不到数字时会自己退回"本机记录"，所以这一条挂了不影响页面可用性。
location = /api/stats/hit {
    include /etc/p3blog/public-proxy-header.conf;   # X-Admin-Proxy-Secret：证明来自本机 nginx
    proxy_pass http://127.0.0.1:8850;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
    proxy_read_timeout 60s;
    # limit_req zone=p3api burst=40 nodelay;
    # limit_req_status 429;
}

location = /api/stats {
    include /etc/p3blog/public-proxy-header.conf;   # X-Admin-Proxy-Secret：证明来自本机 nginx
    proxy_pass http://127.0.0.1:8850;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
    proxy_read_timeout 60s;
}

# ---- 兜底：未列举的 /api/* 一律不存在 ----
# 用**普通前缀**，不要用 ^~：^~ 前缀会压过正则 location，把上面那条 DELETE
# 的正则一起吃掉（nginx 优先级：= 精确 > ^~ 前缀 > 正则 > 普通前缀；
# 正则之间按出现顺序）。这条让"白名单"变成默认拒绝，而不是"落到面板的
# 默认规则再说"。
# 注意：本节**没有**放开 /_admin/、/server/、*.mjs 那几条既有拒绝规则，
# 也没有碰 /comments/（那段 Waline 反代已在上面按审计 S2 停用 → 404）。
location /api/ { return 404; }
# ==== P3_public API 结束 ====

# ==== P3_blog 规则结束 ====
