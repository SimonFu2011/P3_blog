# ============================================================
# P3_blog —— nginx 站点配置
# ------------------------------------------------------------
# 由 deploy/bin/blog-bootstrap.sh 安装到
#   /etc/nginx/sites-available/blog.conf
# 并把 __DOMAIN__ 替换成你的域名（也请自行核对一遍）。
#
# 这份配置只服务"公开产物"，即 /var/www/blog。
# 管理页（/admin/）与本地服务代码（/server/）都不该存在于这个目录里，
# 下面那两条 404 是第二道防线。
# ============================================================

server {
    listen      80;
    listen      [::]:80;
    server_name __DOMAIN__;

    root  /var/www/blog;
    index index.html;

    charset utf-8;

    # ---- 压缩 ----
    # text/html 默认就会被压缩，不用列。
    gzip              on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_vary         on;
    gzip_types        text/css
                      text/plain
                      application/javascript
                      application/json
                      image/svg+xml;

    # ---- 安全头 ----
    # 注意：本文件里**不要**在任何 location 中使用 add_header。
    # nginx 的 add_header 不继承：location 里出现一条，server 块里的全部作废。
    # 缓存请统一用 expires（见下），它与 add_header 不冲突。
    add_header X-Content-Type-Options nosniff            always;
    add_header X-Frame-Options        SAMEORIGIN         always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;

    # CSP 故意不加：站点有内联样式与运行时注入的 DOM，直接上 CSP 会白屏。
    # 需要的话先只观察不拦截，确认无违规后再改成强制：
    # add_header Content-Security-Policy-Report-Only "...report-uri /csp-report" always;

    # ============================================================
    # 第一道防线：管理端与后端源码一律不存在
    # ^~ 是前缀匹配且优先于正则，所以不会被下面的 \.js$ 规则抢走。
    # ============================================================
    location ^~ /admin/  { return 404; }
    location ^~ /server/ { return 404; }
    # 带下划线的那个也要挡：管理页地址是 /_admin/，而上一条只匹配 "/admin/…"。
    location ^~ /_admin/ { return 404; }

    # 兜底：任何位置冒出来的 .mjs / node_modules 都不对外
    location ~* \.(mjs|cjs)$        { return 404; }
    location ^~ /node_modules/      { return 404; }
    location ^~ /.admin/            { return 404; }
    location ^~ /.git/              { return 404; }

    # ============================================================
    # 静态文件
    # ============================================================
    location / {
        # $uri.html 让 /about 也能命中 about.html（旧外链、手打地址都友好）
        try_files $uri $uri/ $uri.html =404;
    }

    # ============================================================
    # 缓存
    # ------------------------------------------------------------
    # 资源文件名没有内容哈希，所以**不能**用 immutable 长缓存。
    # 尤其 js/posts.js —— 它装的是文章正文，属于"内容"，不是"代码"。
    # 给它一年缓存，发完文章自己看不到，还会以为发布失败了。
    # ============================================================
    location ~* \.html$ {
        expires -1;                 # Cache-Control: no-cache，每次都回源校验
    }

    location ~* \.(js|css)$ {
        expires 5m;                 # 改完 5 分钟内全网生效
    }

    # 上传的图片文件名是服务端重新起的随机名，但 avatar.svg 这类是手改资源，
    # 所以给 7 天而不是一年。
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|avif|woff2?)$ {
        expires 7d;
        access_log off;
    }

    # ============================================================
    # 404
    # ------------------------------------------------------------
    # 已知问题：404.html 里用的是相对路径 css/pages.css，而 nginx 是在
    # 原 URL 上内部重写的（地址栏仍停在 /foo/bar），相对路径会解析成
    # /foo/css/pages.css → 404 页面丢样式。
    # 在 404.html 的 <head> 里加一行 <base href="/"> 即可（见 DEPLOY.md 第 5 节）。
    # ============================================================
    error_page 404 /404.html;

    # ============================================================
    # 杂项
    # ============================================================
    # 隐藏文件一律不对外（.gitignore / .gitattributes 之类）
    location ~ /\. { deny all; }

    access_log /var/log/nginx/blog.access.log;
    error_log  /var/log/nginx/blog.error.log;

    # ---- HTTPS ----
    # certbot --nginx 会自动在下面追加 443 server 块与 80→443 跳转，
    # 不需要手工维护。若自己贴证书，就在这里加：
    #
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # add_header Strict-Transport-Security "max-age=31536000" always;
}
