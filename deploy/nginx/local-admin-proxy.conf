# ============================================================
# 本地反代（SSH 隧道专用）—— 由 p3-admin-proxy.service 启动
# ------------------------------------------------------------
# 为什么需要这一层：
#   管理面要求请求带 X-Admin-Proxy-Secret（证明"来自我们的 nginx"），
#   而**浏览器走 SSH 隧道时无法自己加这个头**（导航请求不能自定义头）。
#   所以隧道不能直连 Node 进程，必须指向一个会注入该头的反代。
#
# 拓扑：
#   本地浏览器 → ssh -L 8848 → 服务器 127.0.0.1:8848【nginx，本文件】
#                                   ↓ 注入密钥
#                             服务器 127.0.0.1:8849【node 后台】
#
# 注意：这里**有意**不使用宝塔面板的 nginx 主配置（/www/server/nginx/conf/
# nginx.conf）—— 面板会在改站点设置时重新生成它，规则会丢。本文件与面板
# 互不干扰：独立端口、独立 master 进程。
#
# 改完要重载：systemctl reload p3-admin-proxy
# ============================================================

worker_processes 1;
# 不用 /var/run（受限沙箱下可能不可写），也不与面板的 pid 冲突
pid /run/p3-admin-proxy.pid;
error_log /var/log/p3-admin-proxy-error.log warn;

events {
  worker_connections 256;
}

http {
  # 日志不发访问日志：管理面请求会带上会话 cookie 语义，没必要留痕
  access_log off;

  # 不暴露 nginx 版本
  server_tokens off;

  # 请求体上限：与 node 侧的 MAX_JSON(1MB) / MAX_IMAGE(5MB+64K) 对齐
  client_max_body_size 6m;

  # 反代到 127.0.0.1 时别把上游的 chunked 头弄丢
  proxy_http_version 1.1;

  server {
    # 只绑回环：隧道从哪里进来都行，公网永远看不到这个端口
    listen 127.0.0.1:8848;
    server_name _;

    # 把访问事实与真实 Host 交给 node 侧自己判定
    # （Host/Origin 白名单在应用里；这里不重复实现一遍，免得两处规则不一致）
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- 关键：注入反代共享密钥 ----
    # 值从文件读，不写死在配置里。改密钥后 reload 即可。
    # 用 include 是因为 nginx 没有"从文件读变量"的原生办法。
    include /etc/p3blog/nginx-proxy-secret.conf;

    location / {
      proxy_pass http://127.0.0.1:8849;
      proxy_read_timeout 60s;
      # 管理页与接口都不要缓存
      proxy_buffering off;
    }
  }
}
